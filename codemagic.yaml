# ============================================================
# PhotoViewer 的 Codemagic 云构建配置
# 项目：iOS 原生 App（Swift 5 + UIKit + WKWebView），无第三方依赖
# 用途：在 Codemagic 云上自动构建出可用于侧载/自签安装的 IPA
#
# 使用步骤：
#   1. 把整个项目（含本文件）推送到 GitHub / GitLab / Bitbucket 仓库
#   2. 在 Codemagic 控制台点 "Add application" 关联该仓库
#   3. 推送分支 / 创建 PR 会自动构建，也可在控制台手动触发
#   4. 构建完成后，在本次构建页面的 Artifacts 中下载不签名 IPA
#
# 说明：
#   - 构建脚本会自动检测共享 Scheme：存在则用 -scheme，
#     不存在则回退用 -target 构建，两种方式都无需签名证书。
#   - 已修复启动页缺失图标资源的问题（photo.imageset 已补齐）。
# ============================================================

workflows:
  # ----------------------------------------------------------
  # 工作流一：构建"不签名"IPA（推荐，无需 Apple 开发者证书）
  # 下载后用 AltStore / Sideloadly / TrollStore 等工具自签安装
  # ----------------------------------------------------------
  photo-viewer-unsigned:
    name: PhotoViewer - 构建不签名 IPA（侧载用）
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      xcode: latest        # 使用最新版 Xcode；如需固定版本，改为如 16.4
      vars:
        XCODE_PROJECT: PhotoViewer.xcodeproj
        XCODE_SCHEME: PhotoViewer
        XCODE_TARGET: PhotoViewer
        XCODE_CONFIGURATION: Release
        BUNDLE_ID: com.photoviewer.app   # 与 Xcode 工程中的 Bundle Identifier 保持一致

    # 触发方式：推送任意分支 / 创建 PR 时自动构建（也可在 Codemagic 界面手动触发）
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: '*'
          include: true
          source: true

    scripts:
      - name: 环境诊断（Xcode 版本与 Schemes 列表）
        script: |
          set -e
          xcodebuild -version
          echo "----- Schemes -----"
          xcodebuild -list -project "$XCODE_PROJECT"
          echo "----- 共享 Scheme 检查 -----"
          ls -la PhotoViewer.xcodeproj/xcshareddata/xcschemes/ 2>/dev/null || echo "未找到共享 Scheme 目录，将回退使用 -target 构建"

      - name: 构建 App（关闭代码签名）
        script: |
          set -e
          if [ -f "PhotoViewer.xcodeproj/xcshareddata/xcschemes/$XCODE_SCHEME.xcscheme" ]; then
            echo ">> 使用共享 Scheme 构建: $XCODE_SCHEME"
            xcodebuild \
              -project "$XCODE_PROJECT" \
              -scheme "$XCODE_SCHEME" \
              -configuration "$XCODE_CONFIGURATION" \
              -sdk iphoneos \
              -derivedDataPath build/ios \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
              clean build
          else
            echo ">> 共享 Scheme 缺失，使用 -target 构建: $XCODE_TARGET"
            xcodebuild \
              -project "$XCODE_PROJECT" \
              -target "$XCODE_TARGET" \
              -configuration "$XCODE_CONFIGURATION" \
              -sdk iphoneos \
              SYMROOT="build/ios" \
              OBJROOT="build/ios/obj" \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
              clean build
          fi

      - name: 打包不签名 IPA 与 .app 压缩包
        script: |
          set -e
          # 自动定位构建产物（兼容 scheme / target 两种构建方式）
          APP_PATH="$(find build/ios -type d -name 'PhotoViewer.app' -path '*Release-iphoneos*' | head -1)"
          if [ -z "$APP_PATH" ]; then
            echo "!! 未找到构建产物 PhotoViewer.app"
            find build/ios -name '*.app' -type d
            exit 1
          fi
          echo ">> 构建产物: $APP_PATH"
          # 1) 打包成 IPA（供 AltStore / Sideloadly / TrollStore 等工具安装）
          mkdir -p build/ios/ipa/Payload
          cp -R "$APP_PATH" build/ios/ipa/Payload/
          (cd build/ios/ipa && zip -qry "PhotoViewer-unsigned-${BUILD_NUMBER}.ipa" Payload)
          # 2) 同时打包 .app 压缩包（部分工具可直接使用）
          (cd "$(dirname "$APP_PATH")" && zip -qry "$CM_BUILD_DIR/build/ios/PhotoViewer-app-${BUILD_NUMBER}.zip" PhotoViewer.app)

    artifacts:
      - build/ios/**/*.ipa
      - build/ios/**/*.zip
      - build/ios/**/*.dSYM

  # ----------------------------------------------------------
  # 工作流二（默认注释）：签名构建 Ad Hoc IPA
  # 需要：Apple Developer 账号 + 在 Codemagic 上传签名证书
  # 启用步骤：
