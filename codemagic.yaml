workflows:
  unsigned-ipa:
    name: 构建未签名 IPA
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      xcode: latest
    scripts:
      - name: 构建 App（不签名）
        script: |
          set -e
          xcodebuild \
            -project ImageBrowser.xcodeproj \
            -scheme ImageBrowser \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
      - name: 打包为未签名 IPA
        script: |
          set -e
          rm -rf Payload
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ImageBrowser.app Payload/
          zip -r -y ImageBrowser-unsigned.ipa Payload
    artifacts:
      - ImageBrowser-unsigned.ipa
