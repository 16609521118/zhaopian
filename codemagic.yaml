# Codemagic 构建配置（原生 iOS）
# 文档：https://docs.codemagic.io/yaml/building-a-react-native-app/ 或
#       https://docs.codemagic.io/yaml/building-a-native-ios-app/
#
# 使用方法：
#   1. 把本仓库推送到你的 GitHub 账号
#   2. 在 Codemagic (https://codemagic.io/start) 用 GitHub 登录，添加本仓库
#   3. 首次构建前在 Codemagic → 你的 App → Signing 中配置 Apple Developer 证书
#      （Codemagic 会自动生成并上传证书，或在 App Store Connect 配置 API Key）
#   4. 推送代码或点击 Build 即可触发构建

workflows:
  # 无签名构建：只验证代码能否编译通过，适合日常 CI 检查
  ios-compile-check:
    name: iOS 编译检查
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: 解析 Swift Package 依赖
        script: |
          xcodebuild -resolvePackageDependencies \
            -project FolderMount.xcodeproj \
            -scheme FolderMount
      - name: 编译（Release，无签名）
        script: |
          xcodebuild \
            -project FolderMount.xcodeproj \
            -scheme FolderMount \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build | tee /tmp/xcodebuild.log | tail -n 20
          # 失败时输出完整日志
          set -e
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            grep -E "error:|warning:" /tmp/xcodebuild.log || true
            exit ${PIPESTATUS[0]}
          fi
    artifacts:
      - build/Build/Products/Release-iphoneos/*.app
      - /tmp/xcodebuild.log
    publishing:
      email:
        recipients:
          - you@example.com   # ← 改成你的邮箱，可选
        notify:
          success: true
          failure: true

 