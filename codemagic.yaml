workflows:
  ios-unsigned-build:
    name: Build Unsigned IPA (VLC + Bookmark)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Show environment
        script: |
          set -eux
          ruby --version
          pod --version
          xcodebuild -version

      - name: Install XcodeGen
        script: brew install xcodegen

      - name: Generate Xcode project
        script: xcodegen generate

      - name: Pod install
        script: pod install --repo-update

      - name: Archive (unsigned)
        script: |
          set -eux
          rm -rf ./build
          xcodebuild archive \
            -workspace BookmarkMediaPlayer.xcworkspace \
            -scheme BookmarkMediaPlayer \
            -sdk iphoneos \
            -configuration Release \
            -archivePath ./build/app.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            | xcpretty || true

      - name: Prepare Payload and pack IPA
        script: |
          set -eux
          APP_PATH=$(ls -d ./build/app.xcarchive/Products/Applications/*.app | head -n1)
          echo "Found app: $APP_PATH"
          mkdir -p ./build/Payload
          cp -R "$APP_PATH" ./build/Payload/
          cd ./build
          zip -qr BookmarkMediaPlayer-unsigned.ipa Payload
          ls -lh BookmarkMediaPlayer-unsigned.ipa

    artifacts:
      - build/BookmarkMediaPlayer-unsigned.ipa
