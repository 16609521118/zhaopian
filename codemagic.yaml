# Codemagic 构建配置（原生 iOS，无签名直接打包）
# 文档：https://docs.codemagic.io/yaml/building-a-native-ios-app/
#
# 使用方法：
#   1. 把本仓库推送到你的 GitHub 账号
#   2. 在 Codemagic (https://codemagic.io/start) 用 GitHub 登录，添加本仓库
#   3. 推送代码或点击 Build 即可触发构建，无需配置任何 Apple 证书
#   4. 构建产物：无签名 .ipa（Payload 结构）+ .app

workflows:
  ios-unsigned-build:
    name: iOS 无签名打包
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: 解析 Swift Package 依赖
        script: |
          xcodebuild -resolvePackageDependencies \
            -project FolderMount.xcodeproj \
            -scheme FolderMount
      - name: 无签名构建（Release）
        script: |
          set -e
          xcodebuild \
            -project FolderMount.xcodeproj \
            -scheme FolderMount \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee /tmp/xcodebuild.log | tail -n 30
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "=== 构建失败，错误摘要 ==="
            grep -E "error:|warning:" /tmp/xcodebuild.log || true
            exit ${PIPESTATUS[0]}
          fi
      - name: 组装无签名 IPA（Payload 结构）
        script: |
          set -e
          APP_PATH="build/Build/Products/Release-iphoneos/FolderMount.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "未找到 .app：$APP_PATH"
            ls -R build/Build/Products 2>/dev/null || true
            exit 1
          fi
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          cd build/ipa
          # 用 ditto 打包，保留权限与符号链接
          ditto -c -k --sequesterRsrc --keepParent Payload ../FolderMount-unsigned.ipa
          cd ../..
          echo "=== 产物清单 ==="
          unzip -l build/FolderMount-unsigned.ipa | head -n 20
    artifacts:
      - build/FolderMount-unsigned.ipa
      - build/Build/Products/Release-iphoneos/*.app
      - /tmp/xcodebuild.log
    publishing:
      email:
        recipients:
          - you@example.com   # ← 改成你的邮箱，可选；不需要可删除本段
        notify:
          success: true
          failure: true
