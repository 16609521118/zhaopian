<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>照片查看器</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; background:#f2f2f7; color:#1c1c1e; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif; overscroll-behavior:none; }
  body { padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom); }

  /* 顶栏 */
  .navbar { position:sticky; top:0; z-index:10; display:flex; align-items:center; height:44px; padding:0 16px; background:rgba(242,242,247,0.85); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border-bottom:0.5px solid rgba(0,0,0,0.1); }
  .navbar .back { display:none; width:32px; height:32px; align-items:center; justify-content:center; font-size:22px; color:#007aff; cursor:pointer; }
  .navbar .back.show { display:flex; }
  .navbar .title { flex:1; text-align:center; font-size:17px; font-weight:600; }
  .navbar .spacer { width:32px; }

  /* 文件夹列表 */
  .folder-list { padding:12px; }
  .folder-card { display:flex; align-items:center; padding:14px 16px; background:#fff; border-radius:12px; margin-bottom:10px; cursor:pointer; box-shadow:0 1px 2px rgba(0,0,0,0.04); }
  .folder-card:active { background:#f0f0f5; }
  .folder-icon { width:40px; height:40px; border-radius:10px; background:linear-gradient(135deg,#5ac8fa,#007aff); display:flex; align-items:center; justify-content:center; font-size:20px; margin-right:14px; flex-shrink:0; }
  .folder-info { flex:1; min-width:0; }
  .folder-name { font-size:16px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .folder-count { font-size:13px; color:#8e8e93; margin-top:2px; }
  .folder-arrow { color:#c7c7cc; font-size:18px; margin-left:8px; }

  .empty { text-align:center; padding:80px 24px; color:#8e8e93; }
  .empty h2 { font-size:18px; font-weight:600; margin-bottom:8px; color:#3a3a3c; }
  .empty p { font-size:14px; line-height:1.6; }
  .empty code { background:#e5e5ea; padding:2px 6px; border-radius:4px; font-size:13px; }

  /* 网格 */
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:2px; padding:2px; }
  .grid .cell { position:relative; aspect-ratio:1; overflow:hidden; background:#e5e5ea; cursor:pointer; }
  .grid .cell img { width:100%; height:100%; object-fit:cover; display:block; }
  .grid .cell .video-badge { position:absolute; bottom:4px; right:4px; background:rgba(0,0,0,0.55); color:#fff; font-size:10px; padding:2px 5px; border-radius:4px; }

  /* 查看器 */
  .viewer { position:fixed; inset:0; z-index:100; background:#000; display:none; flex-direction:column; }
  .viewer.show { display:flex; }
  .viewer-bar { display:flex; align-items:center; justify-content:space-between; height:44px; padding:0 16px; color:#fff; background:rgba(0,0,0,0.4); position:absolute; top:0; left:0; right:0; z-index:5; }
  .viewer-bar .close { font-size:22px; cursor:pointer; padding:4px 8px; }
  .viewer-bar .counter { font-size:15px; font-weight:500; }
  .viewer-stage { flex:1; display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative; touch-action:none; }
  .viewer-stage img, .viewer-stage video { max-width:100%; max-height:100%; object-fit:contain; transform-origin:center center; }
  .viewer-nav { position:absolute; bottom:0; left:0; right:0; height:60px; display:flex; align-items:center; justify-content:center; color:rgba(255,255,255,0.6); font-size:13px; z-index:5; }
</style>
</head>
<body>

<div class="navbar">
  <div class="back" id="backBtn" onclick="goBack()">‹</div>
  <div class="title" id="navTitle">照片查看器</div>
  <div class="spacer"></div>
</div>

<div id="folderView" class="folder-list"></div>
<div id="gridView" class="grid" style="display:none;"></div>

<div class="viewer" id="viewer">
  <div class="viewer-bar">
    <div class="close" onclick="closeViewer()">✕</div>
    <div class="counter" id="viewerCounter"></div>
    <div style="width:32px;"></div>
  </div>
  <div class="viewer-stage" id="viewerStage"></div>
  <div class="viewer-nav" id="viewerNav"></div>
</div>

<script>
(function() {
  'use strict';

  var state = { folders: [], currentFolder: null, items: [], viewerIndex: 0 };

  // ---- 工具 ----
  function mediaUrl(folderId, rel) {
    return '/media/' + encodeURIComponent(folderId) + '/' + encodeURIComponent(rel);
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function(c) {
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }

  // ---- 加载文件夹列表 ----
  function loadFolders() {
    fetch('/api/folders', { cache: 'no-store' })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        state.folders = data.folders || [];
        renderFolderList();
      })
      .catch(function() {
        document.getElementById('folderView').innerHTML =
          '<div class="empty"><h2>加载失败</h2><p>本地服务未启动，请重启 App。</p></div>';
      });
  }

  function renderFolderList() {
    var el = document.getElementById('folderView');
    if (!state.folders.length) {
      el.innerHTML =
        '<div class="empty">' +
        '<h2>还没有照片</h2>' +
        '<p>打开系统"文件"App，进入<br><code>我的 iPhone › 照片查看器</code><br>' +
        '把照片或文件夹放进去，然后回到本 App 下拉刷新。</p>' +
        '</div>';
      return;
    }
    var html = '';
    state.folders.forEach(function(f) {
      var count = (f.items || []).length;
      html += '<div class="folder-card" onclick="openFolder(\'' + escapeHtml(f.id) + '\')">' +
        '<div class="folder-icon">📁</div>' +
        '<div class="folder-info">' +
        '<div class="folder-name">' + escapeHtml(f.name) + '</div>' +
        '<div class="folder-count">' + count + ' 个项目</div>' +
        '</div>' +
        '<div class="folder-arrow">›</div>' +
        '</div>';
    });
    el.innerHTML = html;
  }

  // ---- 打开文件夹 ----
  window.openFolder = function(folderId) {
    var f = state.folders.find(function(x) { return x.id === folderId; });
    if (!f) return;
    state.currentFolder = f;
    state.items = f.items || [];
    document.getElementById('folderView').style.display = 'none';
    document.getElementById('gridView').style.display = 'grid';
    document.getElementById('backBtn').classList.add('show');
    document.getElementById('navTitle').textContent = f.name;
    renderGrid();
    window.scrollTo(0, 0);
  };

  window.goBack = function() {
    document.getElementById('gridView').style.display = 'none';
    document.getElementById('folderView').style.display = 'block';
    document.getElementById('backBtn').classList.remove('show');
    document.getElementById('navTitle').textContent = '照片查看器';
    state.currentFolder = null;
  };

  function renderGrid() {
    var el = document.getElementById('gridView');
    if (!state.items.length) {
      el.innerHTML = '<div class="empty" style="grid-column:1/-1;"><h2>空文件夹</h2><p>这个文件夹里还没有照片或视频。</p></div>';
      return;
    }
    var html = '';
    state.items.forEach(function(item, i) {
      var url = mediaUrl(state.currentFolder.id, item.path);
      if (item.type === 'video') {
        html += '<div class="cell" onclick="openViewer(' + i + ')">' +
          '<img src="' + url + '" alt="">' +
          '<div class="video-badge">▶ 视频</div></div>';
      } else {
        html += '<div class="cell" onclick="openViewer(' + i + ')">' +
          '<img src="' + url + '" alt="" loading="lazy"></div>';
      }
    });
    el.innerHTML = html;
  }

  // ---- 全屏查看器 ----
  var viewerEl, stageEl, counterEl, navEl;
  var scale = 1, lastScale = 1, tx = 0, ty = 0, lastTx = 0, lastTy = 0;
  var startX = 0, startY = 0, startDist = 0, isPinching = false, isPanning = false;

  window.openViewer = function(index) {
    viewerEl = document.getElementById('viewer');
    stageEl = document.getElementById('viewerStage');
    counterEl = document.getElementById('viewerCounter');
    navEl = document.getElementById('viewerNav');
    state.viewerIndex = index;
    viewerEl.classList.add('show');
    renderViewerItem();
  };

  window.closeViewer = function() {
    viewerEl.classList.remove('show');
    stageEl.innerHTML = '';
  };

  function renderViewerItem() {
    var item = state.items[state.viewerIndex];
    if (!item) return;
    counterEl.textContent = (state.viewerIndex + 1) + ' / ' + state.items.length;
    navEl.textContent = item.name;
    var url = mediaUrl(state.currentFolder.id, item.path);
    scale = 1; lastScale = 1; tx = 0; ty = 0; lastTx = 0; lastTy = 0;

    if (item.type === 'video') {
      stageEl.innerHTML = '<video src="' + url + '" controls playsinline webkit-playsinline style="width:100%;height:100%;"></video>';
    } else {
      stageEl.innerHTML = '<img src="' + url + '" alt="" style="transform:translate(0px,0px) scale(1);">';
      bindGestures();
    }
  }

  function applyTransform() {
    var img = stageEl.querySelector('img');
    if (img) img.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')';
  }

  function bindGestures() {
    var el = stageEl;
    el.ontouchstart = function(e) {
      if (e.touches.length === 2) {
        isPinching = true; isPanning = false;
        startDist = touchDist(e.touches);
        lastScale = scale;
      } else if (e.touches.length === 1) {
        if (scale > 1.01) { isPanning = true; }
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
        lastTx = tx; lastTy = ty;
      }
    };
    el.ontouchmove = function(e) {
      e.preventDefault();
      if (isPinching && e.touches.length === 2) {
        var d = touchDist(e.touches);
        scale = Math.max(1, Math.min(4, lastScale * (d / startDist)));
        applyTransform();
      } else if (isPanning && e.touches.length === 1) {
        tx = lastTx + (e.touches[0].clientX - startX);
        ty = lastTy + (e.touches[0].clientY - startY);
        applyTransform();
      }
    };
    el.ontouchend = function(e) {
      if (isPinching && e.touches.length < 2) {
        isPinching = false;
        if (scale <= 1.01) { scale = 1; tx = 0; ty = 0; applyTransform(); }
      }
      if (isPanning && e.touches.length === 0) isPanning = false;
    };
    el.ondblclick = function() {
      if (scale > 1.01) { scale = 1; tx = 0; ty = 0; }
      else { scale = 2; }
      applyTransform();
    };
  }

  function touchDist(touches) {
    var dx = touches[0].clientX - touches[1].clientX;
    var dy = touches[0].clientY - touches[1].clientY;
    return Math.sqrt(dx * dx + dy * dy);
  }

  // 左右滑动切换
  var swipeStartX = 0, swipeStartY = 0, swiping = false;
  document.addEventListener('touchstart', function(e) {
    if (!viewerEl || !viewerEl.classList.contains('show')) return;
    if (e.touches.length !== 1) return;
    if (scale > 1.01) return;
    swiping = true;
    swipeStartX = e.touches[0].clientX;
    swipeStartY = e.touches[0].clientY;
  }, { passive: true });
  document.addEventListener('touchend', function(e) {
    if (!swiping) return;
    swiping = false;
    var t = e.changedTouches[0];
    var dx = t.clientX - swipeStartX;
    var dy = t.clientY - swipeStartY;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
      if (dx < 0 && state.viewerIndex < state.items.length - 1) { state.viewerIndex++; renderViewerItem(); }
      else if (dx > 0 && state.viewerIndex > 0) { state.viewerIndex--; renderViewerItem(); }
    }
  }, { passive: true });

  // 下拉刷新文件夹列表
  var pullStartY = 0, pulling = false;
  document.getElementById('folderView').addEventListener('touchstart', function(e) {
    if (window.scrollY <= 0 && e.touches.length === 1) { pulling = true; pullStartY = e.touches[0].clientY; }
  }, { passive: true });
  document.getElementById('folderView').addEventListener('touchend', function(e) {
    if (!pulling) return;
    pulling = false;
    var dy = e.changedTouches[0].clientY - pullStartY;
    if (dy > 80) loadFolders();
  }, { passive: true });

  // 启动
  loadFolders();
})();
</script>
</body>
</html>
