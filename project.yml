name: BookmarkMediaPlayer
options:
  bundleIdPrefix: com.demo
  deploymentTarget:
    iOS: "15.0"
  developmentLanguage: zh-Hans
  xcodeVersion: "15.0"

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  BookmarkMediaPlayer:
    type: application
    platform: iOS
    sources:
      - path: BookmarkMediaPlayer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.demo.BookmarkMediaPlayer
        INFOPLIST_FILE: BookmarkMediaPlayer/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        MACH_O_TYPE: mh_dylib
    preBuildScripts: []

schemes:
  BookmarkMediaPlayer:
    build:
      targets:
        BookmarkMediaPlayer: all
    test:
      targets: []
    run:
      config: Debug
